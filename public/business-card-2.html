<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1050px;height:600px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;display:flex;position:relative;}
.left{flex:1;height:600px;background:#08111e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-top:48px;padding-bottom:196px;}
.divider{width:4px;height:600px;background:#0088FF;flex-shrink:0;}
.right{width:400px;height:600px;background:#0055cc;display:flex;flex-direction:column;justify-content:center;padding:0 48px;padding-bottom:196px;flex-shrink:0;}
.equip-strip{position:absolute;bottom:0;left:0;width:1050px;height:196px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px 28px 32px;border-top:6px solid #888888;background:linear-gradient(to bottom,#e8e8e8,#ffffff);}
.equip-label{font-size:15px;color:rgba(0,0,0,0.72);letter-spacing:.12em;text-transform:uppercase;font-weight:600;}
.equip-icons{display:flex;gap:28px;}
.equip-icon-box{display:flex;width:110px;height:110px;align-items:center;justify-content:center;background:#08111e;border:none;border-radius:10px;flex-shrink:0;}
.logo-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
.logo-wrap::before{content:'';position:absolute;width:260px;height:200px;background:radial-gradient(ellipse at center,rgba(0,136,255,0.22) 0%,transparent 70%);pointer-events:none;}
.wordmark{display:flex;align-items:baseline;gap:6px;}
.wordmark .dolly{font-size:56px;font-weight:800;color:#ffffff;letter-spacing:.12em;}
.wordmark .doc{font-size:56px;font-weight:800;color:#3F96E2;letter-spacing:.12em;}
.slogan{text-align:center;line-height:1.7;}
.slogan span{display:block;font-size:22px;letter-spacing:.04em;}
.slogan span:first-child{color:#ffffff;}
.slogan span:last-child{color:#3F96E2;}
.name{font-size:52px;font-weight:700;color:#ffffff;line-height:1;margin-bottom:10px;}
.title{font-size:14px;font-weight:600;color:rgba(255,255,255,0.65);letter-spacing:.14em;text-transform:uppercase;margin-bottom:26px;}
.rule{width:44px;height:4px;background:rgba(255,255,255,0.5);border-radius:2px;margin-bottom:24px;}
.row{font-size:22px;color:#ffffff;margin-bottom:10px;letter-spacing:.01em;display:flex;align-items:center;gap:11px;}
.row.light{color:rgba(200,230,255,0.9);}
.row:last-child{margin-bottom:0;}
</style></head><body>
