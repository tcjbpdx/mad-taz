<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Business Card Variations — Dolly Doc</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111827; font-family: Arial, Helvetica, sans-serif; padding: 40px 32px; min-height: 100vh; }
    h1 { color: #ffffff; font-size: 20px; font-weight: 700; margin-bottom: 6px; letter-spacing: .02em; }
    .sub { color: #6b7280; font-size: 13px; margin-bottom: 36px; }
    .sub span { color: #3F96E2; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px; max-width: 1200px; }
    .card-wrap { display: flex; flex-direction: column; gap: 12px; }
    .label-row { display: flex; align-items: center; justify-content: flex-start; gap: 10px; }
    .num { background: #1e2a3a; color: #3F96E2; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
    .preview { width: 100%; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,.5); display: block; cursor: pointer; transition: transform .15s, box-shadow .15s; }
    .preview:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(0,136,255,.25); }
    .preview img { width: 100%; display: block; }
    .dl-btn { display: block; text-align: center; background: #1e2a3a; color: #3F96E2; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 9px; border-radius: 6px; text-decoration: none; border: 1px solid #2d3f55; transition: background .15s; }
    .dl-btn:hover { background: #0088FF; color: #ffffff; border-color: #0088FF; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      margin-bottom: 28px;
      color: #6b7280; text-decoration: none; font-size: 13px; font-weight: 600;
      transition: color .15s;
    }
    .back-btn:hover { color: #ffffff; }
  </style>
</head>
<body>
  <a class="back-btn" href="/#projects">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </a>
  <h1>Business Card Variations</h1>
  <p class="sub">1050 × 600 px &nbsp;·&nbsp; 300 DPI &nbsp;·&nbsp; Click any card to view full size</p>

  <div class="grid">

    <div class="card-wrap">
      <div class="label-row">
        <span class="num">01</span>
      </div>
      <a class="preview" href="business-card-1.png" target="_blank">
        <img src="business-card-1.png" alt="Dark Split">
      </a>
      <a class="dl-btn" href="business-card-1.png" download="dolly-doc-card-dark-split.png">↓ Download</a>
    </div>

    <div class="card-wrap">
      <div class="label-row">
        <span class="num">02</span>
      </div>
      <a class="preview" href="business-card-2.png" target="_blank">
        <img src="business-card-2.png" alt="Full Dark">
      </a>
      <a class="dl-btn" href="business-card-2.png" download="dolly-doc-card-full-dark.png">↓ Download</a>
    </div>

  </div>
</body>
</html>
