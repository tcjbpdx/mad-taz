  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0c10;
      --surface: #111418;
      --border:  #1c2030;
      --text:    #e2e4e9;
      --muted:   #5a6070;
      --soft:    #8a90a0;
      --accent:  #4f8ef7;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── SUBNAV (same as the other pages) ───── */
    .subnav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 44px;
      display: flex; align-items: center;
      padding: 0 48px;
      gap: 6px;
      background: rgba(10, 12, 16, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .subnav-btn {
      display: inline-flex; align-items: center;
      padding: 5px 16px;
      border-radius: 6px;
      font-size: 13px; font-weight: 600;
      text-decoration: none;
      color: var(--muted);
      border: 1px solid transparent;
      transition: color .15s, background .15s, border-color .15s;
    }
    .subnav-btn:hover {
      color: var(--text);
      background: var(--surface);
      border-color: var(--border);
    }
    .subnav-btn.active {
      color: var(--accent);
      background: rgba(79,142,247,.08);
      border-color: rgba(79,142,247,.3);
    }

    /* ── HEADER ─────────────────────────────── */
    .page-header {
      max-width: 860px; margin: 0 auto;
      padding: 120px 48px 40px;
      text-align: center;
      position: relative;
    }
    .page-header::before {
      content: '';
      position: absolute; inset: 0; z-index: 0;
      background: radial-gradient(ellipse 70% 80% at 50% 0%, rgba(79,142,247,.09) 0%, transparent 70%);
      pointer-events: none;
    }
    .page-header > * { position: relative; }
    .page-label {
      font-size: 11px; font-weight: 700; letter-spacing: .14em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
    }
    .page-title {
      font-size: 42px; font-weight: 800; color: #ffffff;
      letter-spacing: -.02em; margin-bottom: 14px;
    }
    .page-intro {
      font-size: 17px; color: var(--soft); line-height: 1.7;
      max-width: 520px; margin: 0 auto;
    }

    /* ── LIST ───────────────────────────────── */
    .list {
      max-width: 760px; margin: 0 auto;
      padding: 8px 48px 96px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .article-card {
      display: block; text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 26px 28px 24px;
      transition: border-color .15s, transform .15s, box-shadow .15s;
    }
    .article-card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(79,142,247,.12);
    }
    .article-meta {
      font-size: 12px; font-weight: 600; color: var(--muted);
      letter-spacing: .02em; margin-bottom: 8px;
    }
    .article-title {
      font-size: 24px; font-weight: 700; color: #ffffff;
      letter-spacing: -.015em; line-height: 1.25; margin-bottom: 8px;
    }
    .article-sub { font-size: 15px; color: var(--soft); line-height: 1.6; margin-bottom: 16px; }
    .article-more { font-size: 13px; font-weight: 600; color: var(--accent); }

    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* ── RESPONSIVE ─────────────────────────── */
    @media (max-width: 720px) {
      .subnav { padding: 0 16px; gap: 4px; }
      .subnav-btn { padding: 5px 12px; font-size: 12px; }
      .page-header { padding: 88px 16px 24px; }
      .page-title { font-size: 30px; }
      .page-intro { font-size: 15px; }
      .list { padding: 4px 16px 64px; }
      .article-card { padding: 20px 18px 18px; }
      .article-title { font-size: 20px; }
    }
    @media (max-width: 380px) {
      .subnav-btn { padding: 5px 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .subnav-btn, .article-card { transition: none; }
      .article-card:hover { transform: none; }
    }
  </style>
</head>

      <span class="article-more">Read the article →</span>
    </a>

  </main>

</body>
</html>
