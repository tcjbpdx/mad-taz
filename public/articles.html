<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Paper on the dark site, like the articles: the menu and heading sit on
       the site's own near-black, and the list is a soft off-white sheet. */
    :root {
      --bg:#0a0c10; --line:#1c2030;
      --ink:#f2f3f6; --body:#c9ccd5; --soft:#9aa0ad; --muted:#7d8494;
      --accent:#6ea2ff; --paper:#f1efea;
      --serif: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      color-scheme: dark;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: rgba(79,142,247,.35); }

    /* ── SUBNAV (same links as the other pages) ── */
    .subnav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 44px;
      display: flex; align-items: center;
      padding: 0 48px;
      gap: 6px;
      background: rgba(10, 12, 16, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .subnav-btn {
      display: inline-flex; align-items: center;
      padding: 5px 16px;
      border-radius: 6px;
      font-size: 13px; font-weight: 600;
      text-decoration: none;
      color: var(--muted);
      border: 1px solid transparent;
      transition: color .15s, background .15s, border-color .15s;
    }
    .subnav-btn:hover {
      color: #e2e4e9;
      background: #141821;
      border-color: #262c3a;
    }
    .subnav-btn.active {
      color: var(--accent);
      background: rgba(79,142,247,.12);
      border-color: rgba(79,142,247,.35);
    }

    /* ── HEADER ─────────────────────────────── */
    .page-header {
      max-width: 760px; margin: 0 auto;
      padding: 116px 40px 0;
    }
    .page-label {
      font-size: 12px; font-weight: 700; letter-spacing: .14em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 14px;
    }
    .page-title {
      font-size: 48px; font-weight: 800; color: var(--ink);
      line-height: 1.08; letter-spacing: -.028em; margin-bottom: 14px;
    }
    .page-intro {
      font-size: 22px; color: var(--soft); line-height: 1.45;
      text-wrap: balance;
    }

    /* ── LIST ───────────────────────────────── */
    /* An index like a publication's, on a sheet: each article a row between thin lines. */
    .list {
      max-width: 820px; margin: 0 auto;
      padding: 40px 0 96px;
    }
    .list-inner {
      --ink:#15171c; --body:#2b2e35; --muted:#6a7181; --line:#dedbd3; --accent:#1f5fd6;
      background: var(--paper);
      border-radius: 16px;
      padding: 10px 70px;
    }
    .article-card:last-child { border-bottom: 0; }
    .article-card {
      display: block; text-decoration: none;
      padding: 30px 0 30px;
      border-bottom: 1px solid var(--line);
    }
    .article-meta {
      font-size: 13px; font-weight: 600; color: var(--muted);
      letter-spacing: .01em; margin-bottom: 8px;
    }
    .article-title {
      font-size: 30px; font-weight: 800; color: var(--ink);
      letter-spacing: -.022em; line-height: 1.2; margin-bottom: 10px;
      transition: color .15s;
    }
    .article-sub {
      font-family: var(--serif);
      font-size: 19px; color: var(--body); line-height: 1.6; margin-bottom: 14px;
    }
    .article-more { font-size: 14px; font-weight: 700; color: var(--accent); }
    .article-card:hover .article-title { color: var(--accent); }
    .article-card:hover .article-more { text-decoration: underline; text-underline-offset: 3px; }

    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    .article-card:focus-visible { outline-offset: 6px; }

    /* ── RESPONSIVE ─────────────────────────── */
    @media (max-width: 720px) {
      .subnav { padding: 0 16px; gap: 4px; }
      .subnav-btn { padding: 5px 12px; font-size: 12px; }
      .page-header { padding: 84px 24px 0; }
      .page-title { font-size: 34px; }
      .page-intro { font-size: 18px; }
      .list { padding: 28px 8px 64px; }
      .list-inner { padding: 4px 16px; border-radius: 14px; }
      .article-card { padding: 24px 0; }
      .article-title { font-size: 24px; }
      .article-sub { font-size: 17.5px; }
    }
    @media (max-width: 380px) {
      .subnav-btn { padding: 5px 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .subnav-btn, .article-title { transition: none; }
    }
  </style>
</head>
<body>

  <nav class="subnav" aria-label="Site">
    <a class="subnav-btn" href="/#bio">Bio</a>
    <a class="subnav-btn" href="/#projects">Projects</a>
    <a class="subnav-btn" href="/accreditation.html">Accreditation</a>
    <a class="subnav-btn active" href="/articles.html" aria-current="page">Articles</a>
  </nav>

  <header class="page-header">
    <div class="page-label">Writing</div>
    <h1 class="page-title">Articles</h1>
    <p class="page-intro">Notes from building Dolly Doc on my days off.</p>
  </header>

  <main class="list">
    <div class="list-inner">

    <a class="article-card" href="/articles/the-meeting-before-the-code.html">
      <div class="article-meta"><time datetime="2026-11-22">November 2026</time> · 8 min read</div>
      <h2 class="article-title">The Meeting Before the Code</h2>
      <p class="article-sub">A truck driver’s case for treating AI as a colleague, not just a code machine</p>
      <span class="article-more">Read the article →</span>
    </a>

    </div>
  </main>

</body>
</html>
